<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="./CSS/estilos.css" />

    <!-- Stack Sans Headline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body onload="load_navbar(); load_footer();">
    <!--<body onload="load_navbar(); load_footer();">-->
    <!-- NavBar -->
    <div id="navbar"></div>

    <!-- Mi perfil -->
    <h1 class="text-center">Nos alegra verte</h1>
    <p class="text-center mb-4 contacto">
      Inicia sesión para acceder a tu cuenta
    </p>

    <div class="container my-5">
      <div class="row align-items-center justify-content-center">
        <!-- Imagen (solo tablet y desktop) -->
        <div class="col-md-6 d-none d-md-flex justify-content-center">
          <img
            src="./assets/libroGalaxia1 copia.png"
            alt="Inicio de sesión"
            class="img-fluid imagen-login"
          />
        </div>

        <!-- FORMULARIO -->
        <div class="col-12 col-md-6">
          <div class="form-card formRegistro">
            <form id="loginForm" novalidate>
              <!-- Correo -->
              <div class="mb-3 row justify-content-center">
                <label for="correo" class="form-label contacto">
                  Correo electrónico
                </label>
                <input type="email" id="correo" class="contacto" required />
                <div class="invalid-feedback">Ingresa un correo válido.</div>
              </div>

              <!-- Contraseña -->
              <div class="mb-3 row justify-content-center">
                <label for="password" class="form-label contacto">
                  Contraseña
                </label>
                <input
                  type="password"
                  id="password"
                  class="contacto password"
                  required
                />
                <div class="invalid-feedback">Contraseña inválida.</div>
              </div>

              <!-- Mostrar / ocultar contraseña -->
              <button
                type="button"
                id="togglePassword"
                class="btn btn-sm mb-3 toggle-boton"
              >
                Mostrar / Ocultar
              </button>

              <!-- Submit -->
              <div class="text-center mt-4">
                <button type="submit" class="btn fw-bold contacto-boton">
                  Iniciar sesión
                </button>
              </div>

              <p class="text-center mt-3">¿Aún no tienes una cuenta?</p>

              <div class="text-center mt-4">
                <button type="button" class="btn fw-bold contacto-boton">
                  <a href="registro.html" class="fw-semibold">Crear cuenta</a>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!--Footer-->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script JS -->
    <script src="js/layout.js"></script>
    <script>
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");

      togglePassword.addEventListener("click", () => {
        passwordInput.type =
          passwordInput.type === "password" ? "text" : "password";
      });
    </script>
    <script>
  document.addEventListener("DOMContentLoaded", () => {
    const usuarioActivo = JSON.parse(localStorage.getItem("usuarioActivo"));

    if (usuarioActivo) {
      alert(`Ya tienes sesión iniciada, ${usuarioActivo.nombre}`);
      window.location.href = "index.html";
    }
  });
</script>

<!-- Sweet Alert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- JS Login -->
    <script src="js/login.js"></script>
  </body>
</html>
