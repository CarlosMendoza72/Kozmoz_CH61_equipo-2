    <form id="loginForm" class="needs-validation" novalidate>

        <h2 class="h4 mb-4 text-center text-primary">Iniciar sesión</h2>

        <div class="row g-3">
            <!-- Campo 1: Nombre (Texto) -->
            <div class="col-md-6">
                <label for="firstName" class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="firstName" required minlength="2" placeholder="Tu Nombre">
                <div class="invalid-feedback">
                </div>
            </div>

            <!-- Campo 2: Apellido (Texto) -->
            <div class="col-md-6">
                <label for="lastName" class="form-label">Apellido <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="lastName" required minlength="2" placeholder="Tu Apellido">
                <div class="invalid-feedback">
                </div>
            </div>
        </div>

        <!-- Campo 3: Correo Electrónico (Email) -->
        <div class="mb-4 mt-3">
            <label for="userEmail" class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="userEmail" required placeholder="ejemplo@dominio.com">
            <div class="invalid-feedback">
            </div>
        </div>

        <hr>

        <!-- Botón de Acción (Login) -->
        <div class="d-grid">
            <!-- Usamos d-grid para que el botón ocupe todo el ancho del contenedor -->
            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    class="bi bi-box-arrow-in-right me-2" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z" />
                    <path fill-rule="evenodd"
                        d="M11.854 8.354a.5.5 0 0 0 0-.708L10 5.293V7H2v2h8v1.707l1.854-1.853zM11.5 8a.5.5 0 0 1 0 1h-7V7h7a.5.5 0 0 1 0 1z" />
                </svg>
                Iniciar Sesión / Registrar
            </button>
        </div>
    </form>
