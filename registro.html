<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="./CSS/estilos.css">

  <!-- Stack Sans Headline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Stack+Sans+Headline:wght@200..700&display=swap"
    rel="stylesheet">
</head>

<body onload="load_navbar(); load_footer();">
  <!-- NavBar -->
  <div id="navbar"></div>

  <!--Formulario de Registro-->
  <!--Yerania, Jess y Karen-->
  <form>
    <div class="row justify-content-center">
      <label for="nombres" class="col-sm-2 col-form-label">Nombre(s)</label>
      <div class="col-12 col-md-8 col-lg-6">
        <input type="nombre" class="form-control" id="nombres">
        <span id="fullNameError" class="error"></span>
      </div>
    </div>
    <div class="row justify-content-center">
      <label for="apellidos" class="col-sm-2 col-form-label">Apellido(s)</label>
      <div class="col-12 col-md-8 col-lg-6">
        <input type="apellido" class="form-control" id="apellidos">
      </div>
    </div>
    <div class="row justify-content-center">
      <label for="telefono" class="col-sm-2 col-form-label">Teléfono</label>
      <div class="col-12 col-md-8 col-lg-6">
        <input type="tel" class="form-control" id="telefono">
      </div>
    </div>
    <div class="row justify-content-center">
      <label for="correo" class="col-sm-2 col-form-label">Correo electrónico</label>
      <div class="col-12 col-md-8 col-lg-6">
        <input type="email" class="form-control" id="correo">
      </div>
    </div>
    <div class="row justify-content-center">
      <label for="contraseña" class="col-sm-2 col-form-label">Contraseña</label>
      <div class="col-12 col-md-8 col-lg-6">
        <input type="password" class="form-control password" id="password" name="password" required>
        <!-- <input type="text" id="password" name="password"> -->
      </div>
    </div>

    <div class="row justify-content-center">
      <label for="confirmacionDeContraseña" class="col-sm-2 col-form-label">Confirma tu contraseña</label>
      <div class="col-12 col-md-8 col-lg-6">
        <input type="password" class="form-control password" id="password1" name="password" required>

        <!-- Botón para ocultar y mostrar la contraseña -->
        <button type="button" id="togglePassword">Mostrar / Ocultar</button>
        <script>
          const passwordInput = document.getElementById("password");
          const passwordInput1 = document.getElementById("password1");
          const togglePassword = document.getElementById("togglePassword");

          togglePassword.addEventListener("click", () => {
            const tipoActual = passwordInput.getAttribute("type");
            passwordInput.setAttribute(
              "type",
              tipoActual === "password" ? "text" : "password"
            );
            const tipoActual1 = passwordInput1.getAttribute("type");
            passwordInput1.setAttribute(
              "type",
              tipoActual1 === "password" ? "text" : "password"
            );
          });
        </script>
      </div>
    </div>

    <fieldset class="row justify-content-center">
      <legend class="col-form-label col-sm-2 pt-0"></legend>
      <div class="col-12 col-md-8 col-lg-6">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1" value="option1" checked>
          <label class="form-check-label" for="gridRadios1">
            Acepto términos y condiciones.
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2" value="option2">
          <label class="form-check-label" for="gridRadios2">
            Autorizo recibir promociones por correo electrónico.
          </label>
        </div>
      </div>
    </fieldset>
    </div>
    </div>
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary px-4">Crear mi cuenta</button>
    </div>
  </form>
</body>
<!--Footer-->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script JS -->
<script src="js/layout.js"></script>
<script src="js/registro.js"></script>

</html>
