<body onload="load_navbar(); load_footer();">
    <!-- NavBar -->
    <div id="navbar"></div>

    <!--Formulario de Registro-->
    <!--Yerania, Jess y Karen-->
    <!--<h2 class="text-center mb-3 mt-5"></h2>
    <form> -->

        <div class="form-card">
    <form id="loginForm" class="needs-validation" novalidate>

    
    <h2 class="text-center mb-3">
        <i class="bi bi-stars"></i> Únete a Kozmoz y descubre un universo de conocimiento
    </h2>
    <p class="text-center mb-4 text-muted">
        Nos encanta que estés aquí. Completa tus datos y forma parte de nuestra comunidad lectora.
    </p>
    
       <!-- <div class="card-body p-4">-->
                <div class="row justify-content-center">
                    <label for="nombres" class="col-sm-2 col-form-label">Nombre(s)</label>
                    <div class="col-12 col-md-8 col-lg-6">
                        <input type="nombre" class="form-control" id="nombres">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <label for="apellidos" class="col-sm-2 col-form-label">Apellido(s)</label>
                    <div class="col-12 col-md-8 col-lg-6">
                        <input type="apellido" class="form-control" id="apellidos">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <label for="telefono" class="col-sm-2 col-form-label">Teléfono</label>
                    <div class="col-12 col-md-8 col-lg-6">
                        <input type="tel" class="form-control" id="telefono">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <label for="correo" class="col-sm-2 col-form-label">Correo electrónico</label>
                    <div class="col-12 col-md-8 col-lg-6">
                        <input type="email" class="form-control" id="correo">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <label for="contraseña" class="col-sm-2 col-form-label">Contraseña</label>
                    <div class="col-12 col-md-8 col-lg-6">
                        <input type="password" class="form-control" id="contraseña">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <label for="confirmacionDeContraseña" class="col-sm-2 col-form-label">Confirma tu contraseña</label>
                    <div class="col-12 col-md-8 col-lg-6">
                        <input type="password" class="form-control" id="confirmacionDeContraseña">
                    </div>
                </div>
                <fieldset class="row justify-content-center">
                    <legend class="col-form-label col-sm-2 pt-0"></legend>
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1"
                                value="option1" checked>
                            <label class="form-check-label" for="gridRadios1">
                                Acepto términos y condiciones
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2"
                                value="option2">
                            <label class="form-check-label" for="gridRadios2">
                                Autorizo recibir promociones por correo electrónico
                            </label>
                        </div>
                    </div>
                </fieldset>
        <!--</div>-->
    
    <div class="text-center mt-4">
        <button type="submit" class="btn px-4" >
        
    Crear mi cuenta
</button>
    </div>
    <p class="text-center mt-3">
                        ¿Ya tienes una cuenta?  
                        <a href="" class="fw-semibold">Inicia sesión</a>
                    </p>
    </form>
</body>
</div>

<div id="footer"></div>
