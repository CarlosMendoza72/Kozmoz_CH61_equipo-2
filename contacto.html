<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="./CSS/estilos.css">

  <!-- Stack Sans Headline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Stack+Sans+Headline:wght@200..700&display=swap"
    rel="stylesheet">
</head>




<body onload="load_navbar(); load_footer();">
  <!-- NavBar -->
  <div id="navbar"></div>

  <!-- Contacto -->

  <div class="container contacto-container">
    <h1 class="contacto">Contáctanos</h1>
    <!-- <h2 class="text-center mb-3 contacto">
      Dudas, aclaraciones y sugerencias
    </h2> -->
    <p class="text-center mb-4 contacto">
      Te enviaremos lo antes posible una respuesta personalizada
      según tus necesidades.
    </p>

    <div class="row justify-content-center contacto">
      <div class="col-md-7 mx-auto">
        <form id="formContacto" novalidate>
          <div class="mb-3">
            <label class="form-label contacto">Tipo de usuario</label>
            <select id="tipoCliente" name="tipoCliente" class="form-select contacto" required>
              <option value="" class="contacto">Selecciona una opción</option>
              <option value="Premium" class="contacto">Premium</option>
              <option value="Suscrito" class="contacto">Suscrito</option>
              <option value="Usuario registrado" class="contacto">Usuario registrado</option>
              <option value="Visitante" class="contacto">Visitante</option>
            </select>
            <div class="invalid-feedback contacto">Selecciona una opción.</div>
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label contacto">Nombre (s)</label>
            <input type="text" id="nombre" name="nombre" class="contacto" required>
            <div class="invalid-feedback">
              Ingresa tu nombre.
            </div>
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label contacto">Apellido (s)</label>
            <input type="text" id="apellidoPat" name="apellido" class="contacto" required>
            <div class="invalid-feedback">
              Ingresa tu(s) apellido(s).
            </div>
          </div>

          <div class="mb-3">
            <label for="telefono" class="form-label contacto">Número telefónico</label>
            <input type="text" id="telefono" name="telefono" class="contacto" placeholder="+52  . . ." required>
            <div class="invalid-feedback">
              Ingresa tu número telefónico.
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label contacto">Correo electrónico</label>
            <input type="email" id="email" name="correo" class="contacto" placeholder="email@example.com" required>
            <div class="invalid-feedback">Ingresa un correo válido.</div>
          </div>

          <div class="mb-3">
            <label for="mensaje" class="form-label contacto">Especifica duda, aclaración o sugerencia</label>
            <textarea id="mensaje" name="mensaje" class="contacto" rows="4" placeholder="Mínimo 10 caracteres" required></textarea>
            <div class="invalid-feedback">Escribe tu mensaje.</div>
          </div>

          <button type="submit" class="btn fw-bold contacto-boton" id="btnEnviar">
            <span class="contacto-texto">Enviar mensaje</span></button>

          <p id="mensajeExito" class="mt-3 text-center d-none">
            ¡Gracias! Te contactaremos pronto.
          </p>
        </form>
      </div>
    </div>
  </div>

  <!--Footer-->
  <div id="footer"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script JS -->
  <script src="js/layout.js"></script>

  <!-- referencia para Inicializar emailjs -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
  </script>

  <!-- Inicializar emailjs -->
  <script>
    emailjs.init({
      publicKey: "QQxRPtXWCoCAyuD2z",
    });
  </script>

  <!-- Script JS / main.js -->
  <script src="js/contacto.js"></script>

</body>

</html>
