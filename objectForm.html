<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añade objetos</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="./CSS/estilos.css">
  <link rel="stylesheet" href="./CSS/items.css">

  <!-- Stack Sans Headline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Stack+Sans+Headline:wght@200..700&display=swap"
    rel="stylesheet">
</head>

<body onload="load_navbar(); load_footer();">
  <!-- NavBar -->
  <div id="navbar"></div>

  <!-- formulario -->
  <form id="card-form">
    <h3>Agregar nuevo libro</h3>

    <label>Título:</label>
    <input type="text" id="title" required>

    <label>Descripción:</label>
    <textarea id="description" required></textarea>

    <label>Precio:</label>
    <input type="number" id="price" required>

    <label>Imagen (ruta o URL):</label>
    <input type="text" id="image" required>

    <button type="submit">Agregar</button>
  </form>

  <div id="cards-container"></div>

  <!-- footer -->
  <div id="footer"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script JS -->
  <script src="js/layout.js"></script>
</body>

</html>
